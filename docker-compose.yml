services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["5005:5005"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:5005" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
