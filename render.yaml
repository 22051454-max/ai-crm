databases:
  - name: crm-db
    plan: free
services:
  - type: web
    name: ai-crm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: crm-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-crm.vercel.app
      - key: OPENAI_API_KEY
        sync: false
